{{define "component/aExternalClientTable"}}
<template slot="externalClientActions" slot-scope="text, client, index">
  <a-tooltip>
    <template slot="title">{{ i18n "pages.client.edit" }}</template>
    <a-icon :style="{ fontSize: '22px' }" class="normal-icon" type="edit" @click="openEditExternalClient(record.id,client);"></a-icon>
  </a-tooltip>
  <a-tooltip>
    <template slot="title">
      <span :style="{ color: '#FF4D4F' }"> {{ i18n "delete"}}</span>
    </template>
    <a-popover trigger="click" :overlay-class-name="themeSwitcher.currentTheme">
      <template slot="content">
        <div>{{ i18n "pages.inbounds.deleteClientContent" }}</div>
        <a-space :style="{ marginTop: '8px' }">
          <a-button size="small" type="default">{{ i18n "cancel" }}</a-button>
          <a-button size="small" type="danger" @click="delExternalClient(record.id,client,false)">{{ i18n "delete" }}</a-button>
          <a-button size="small" type="danger" @click="delExternalClientAll(client)">{{ i18n "pages.inbounds.deleteClientAll" }}</a-button>
        </a-space>
      </template>
      <a-icon :style="{ fontSize: '22px', cursor: 'pointer' }" class="delete-icon" type="delete"></a-icon>
    </a-popover>
  </a-tooltip>
</template>
<template slot="externalClientEnable" slot-scope="text, client, index">
  <a-switch v-model="client.enable" @change="switchEnableExternalClient(record.id,client)"></a-switch>
</template>
<template slot="externalClientInfo" slot-scope="text, client">
  <a-space direction="vertical" :size="2">
    <span class="client-email">[[ client.email ]]</span>
    <template v-if="client.comment && client.comment.trim()">
      <a-tooltip v-if="client.comment.length > 50" :overlay-class-name="themeSwitcher.currentTheme">
        <template slot="title">
          [[ client.comment ]]
        </template>
        <span class="client-comment">[[ client.comment.substring(0, 47) + '...' ]]</span>
      </a-tooltip>
      <span v-else class="client-comment">[[ client.comment ]]</span>
    </template>
  </a-space>
</template>
<template slot="externalClientExpiry" slot-scope="text, client, index">
  <template v-if="client.expiryTime !=0 && client.reset >0">
    <a-popover :overlay-class-name="themeSwitcher.currentTheme">
      <template slot="content">
        <span v-if="client.expiryTime < 0">{{ i18n "pages.client.delayedStart" }}</span>
        <span v-else>[[ IntlUtil.formatDate(client.expiryTime) ]]</span>
      </template>
      <table>
        <tr class="tr-table-box">
          <td class="tr-table-rt"> [[ IntlUtil.formatRelativeTime(client.expiryTime) ]] </td>
          <td class="infinite-bar tr-table-bar">
            <a-progress :show-info="false" :percent="expireProgress(client.expiryTime, client.reset)" />
          </td>
          <td class="tr-table-lt">[[ client.reset + "d" ]]</td>
        </tr>
      </table>
    </a-popover>
  </template>
  <template v-else>
    <a-popover v-if="client.expiryTime != 0" :overlay-class-name="themeSwitcher.currentTheme">
      <template slot="content">
        <span v-if="client.expiryTime < 0">{{ i18n "pages.client.delayedStart" }}</span>
        <span v-else>[[ IntlUtil.formatDate(client.expiryTime) ]]</span>
      </template>
      <a-tag :style="{ minWidth: '50px', border: 'none' }" :color="ColorUtils.userExpiryColor(app.expireDiff, client, themeSwitcher.isDarkTheme)"> [[ IntlUtil.formatRelativeTime(client.expiryTime) ]] </a-tag>
    </a-popover>
    <a-tag v-else :color="ColorUtils.userExpiryColor(app.expireDiff, client, themeSwitcher.isDarkTheme)" :style="{ border: 'none' }" class="infinite-tag">
      <svg height="10px" width="14px" viewBox="0 0 640 512" fill="currentColor">
        <path d="M484.4 96C407 96 349.2 164.1 320 208.5C290.8 164.1 233 96 155.6 96C69.75 96 0 167.8 0 256s69.75 160 155.6 160C233.1 416 290.8 347.9 320 303.5C349.2 347.9 407 416 484.4 416C570.3 416 640 344.2 640 256S570.3 96 484.4 96zM155.6 368C96.25 368 48 317.8 48 256s48.25-112 107.6-112c67.75 0 120.5 82.25 137.1 112C276 285.8 223.4 368 155.6 368zM484.4 368c-67.75 0-120.5-82.25-137.1-112C364 226.2 416.6 144 484.4 144C543.8 144 592 194.2 592 256S543.8 368 484.4 368z" fill="currentColor"></path>
      </svg>
    </a-tag>
  </template>
</template>
<template slot="externalClientActionMenu" slot-scope="text, client, index">
  <a-dropdown :trigger="['click']">
    <a-icon @click="e => e.preventDefault()" type="ellipsis" :style="{ fontSize: '20px' }"></a-icon>
    <a-menu slot="overlay" :theme="themeSwitcher.currentTheme">
      <a-menu-item @click="openEditExternalClient(record.id,client);">
        <a-icon :style="{ fontSize: '14px' }" type="edit"></a-icon>
        {{ i18n "pages.client.edit" }}
      </a-menu-item>
      <a-menu-item @click="delExternalClient(record.id,client)">
        <a-icon :style="{ fontSize: '14px' }" type="delete"></a-icon>
        <span :style="{ color: '#FF4D4F' }"> {{ i18n "delete"}}</span>
      </a-menu-item>
      <a-menu-item @click="delExternalClientAll(client)">
        <a-icon :style="{ fontSize: '14px' }" type="delete"></a-icon>
        <span :style="{ color: '#FF4D4F' }"> {{ i18n "pages.inbounds.deleteClientAll"}}</span>
      </a-menu-item>
      <a-menu-item>
        <a-switch v-model="client.enable" size="small" @change="switchEnableExternalClient(record.id,client)"></a-switch>
        {{ i18n "enable"}}
      </a-menu-item>
    </a-menu>
  </a-dropdown>
</template>
{{end}}
